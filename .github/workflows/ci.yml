name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Diagnose immediate close delivery repeatedly
        run: npx playwright test tests/browser/issue-state.spec.ts --grep=closeの遅いACK --repeat-each=10 --workers=1 --max-failures=0
      - name: Verify toolbar, page navigation, highlight choices and canonical Issue state
        run: npx playwright test tests/browser/toolbar-select.spec.ts tests/browser/page-navigation.spec.ts tests/browser/highlight-demo.spec.ts tests/browser/issue-state.spec.ts --workers=1 --max-failures=0
      - name: Verify live Status colors across autosave redraws
        run: npx playwright test tests/browser/rich.spec.ts --grep="author is distinct" --repeat-each=3 --workers=1
      - name: Keep focused synthetic interaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-interaction-focus
          path: |
            test-results/toolbar-rich-*.png
            test-results/highlight-demo-*.png
            test-results/issue-state-*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Verify motion and compact titles independently before the full browser suite
        run: npx playwright test tests/browser/unestimated-motion.spec.ts tests/browser/task-title-readability.spec.ts --workers=1 --max-failures=0
      - name: Keep focused synthetic motion and title evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-ui-focus
          path: |
            test-results/unestimated-motion-*.png
            test-results/unestimated-motion-*.json
            test-results/task-title-readable-*.png
          retention-days: 1
          if-no-files-found: ignore
      - name: Verify calendar access and existing schedule contracts
        run: npx playwright test tests/browser/burndown.spec.ts tests/browser/burndown-layout.spec.ts --workers=1
      - name: Verify native edge-scroll cancellation repeatedly
        run: npx playwright test tests/browser/drag-lifecycle.spec.ts --grep=auto-scroll --repeat-each=3 --workers=1
      - name: Verify native card dragging and interrupted gestures before the full browser suite
        run: npx playwright test tests/browser/drag-continuity.spec.ts tests/browser/drag-races.spec.ts tests/browser/drag-lifecycle.spec.ts --workers=1
      - name: Verify clipped-card visibility before the full browser suite
        run: npx playwright test tests/browser/unestimated-highlight.spec.ts --project=desktop --grep=overflow --repeat-each=3 --workers=1
      - name: Verify card metadata, U and current Sprint before the full browser suite
        run: npx playwright test tests/browser/task-metadata.spec.ts tests/browser/current-sprint.spec.ts tests/browser/unestimated-highlight.spec.ts --project=desktop --workers=1
      - run: npm run test:e2e
      - name: Keep synthetic UI screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-ui-screenshots
          path: |
            test-results/unestimated-highlight-*.png
            test-results/burndown-rollover-*.png
            test-results/task-metadata-*.png
            test-results/unestimated-motion-*.png
            test-results/unestimated-motion-*.json
            test-results/task-title-readable-*.png
            test-results/burndown-layout-*.png
            test-results/burndown-enter-*.png
            test-results/toolbar-rich-*.png
            test-results/highlight-demo-*.png
            test-results/issue-state-*.png
          retention-days: 1
          if-no-files-found: ignore

  auth-check:
    # Secretはrunner内だけ。checkout/依存実行なし、値・長さ・hashは出さない。
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'junhat6/ideaboost-whiteboard' }}
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Validate credential format and read-only Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN || "";
          const checks = {
            present: Boolean(token),
            whitespaceFree: !/\s/.test(token),
            noQuotes: !/["'`]/.test(token),
            noBearerPrefix: !/^Bearer\b/i.test(token),
            accountTokenPrefix: token.startsWith("cfat_"),
            accountMatches: process.env.CLOUDFLARE_ACCOUNT_ID === "29a0469ba7d11f29ac94e3ed41f388a8",
          };
          console.log(JSON.stringify(checks));
          // Prefixは診断だけ。旧形式の有効tokenはAPIの実認証で判断する。
          const safeToVerify = checks.present && checks.whitespaceFree && checks.noQuotes &&
            checks.noBearerPrefix && checks.accountMatches;
          if (!safeToVerify) {
            process.exitCode = 1;
          } else {
            const root = "https://api.cloudflare.com/client/v4/accounts/29a0469ba7d11f29ac94e3ed41f388a8";
            for (const [name, path] of [
              ["tokenVerification", "/tokens/verify"],
              ["workerRead", "/workers/scripts/ideaboost-whiteboard/deployments"],
            ]) {
              try {
                const response = await fetch(root + path, {
                  method: "GET",
                  headers: { Authorization: `Bearer ${token}` },
                  redirect: "error",
                  signal: AbortSignal.timeout(10000),
                });
                const body = await response.json().catch(() => ({}));
                const ok = response.ok && body.success !== false &&
                  (name !== "tokenVerification" || body.result?.status === "active");
                console.log(JSON.stringify({ [name]: ok, httpStatus: response.status }));
                if (!ok) { process.exitCode = 1; break; }
              } catch {
                console.log(JSON.stringify({ [name]: false, requestCompleted: false }));
                process.exitCode = 1;
                break;
              }
            }
          }
          JS

  deploy:
    # 承認済みproduction環境はmain branchだけ許可。PRには配信secretを渡さない。
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'junhat6/ideaboost-whiteboard' }}
    needs: [check, auth-check]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: ideaboost-whiteboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # 認証を渡す前に依存と静的bundleを準備。PR由来artifact/cacheは使わない。
      - run: npm ci
      - run: npm run build:editor
      - name: Verify trusted commit and production settings
        run: node scripts/deployment-check.mjs guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      - name: Deploy existing Worker without replacing runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG_PATH: .wrangler/logs
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Deployment credential is not configured"; exit 1; }
          npx --no-install wrangler deployments list --name ideaboost-whiteboard --json
          npx --no-install wrangler deploy --name ideaboost-whiteboard --keep-vars --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID"
          npx --no-install wrangler deployments list --name ideaboost-whiteboard --json
      - name: Read-only production health and asset verification
        run: node scripts/deployment-check.mjs smoke
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      - name: Read-only Sprint 9 saved-history verification
        run: node scripts/deployment-check.mjs rollover-smoke
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      - name: Read-only current Sprint metadata verification
        run: node scripts/deployment-check.mjs current-sprint-smoke
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
