name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    # 承認済みproduction環境はmain branchだけ許可。PRには配信secretを渡さない。
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'junhat6/ideaboost-whiteboard' }}
    needs: check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: ideaboost-whiteboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # 認証を渡す前に依存と静的bundleを準備。PR由来artifact/cacheは使わない。
      - run: npm ci
      - run: npm run build:editor
      - name: Verify trusted commit and production settings
        run: node scripts/deployment-check.mjs guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      - name: Deploy existing Worker without replacing runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG_PATH: .wrangler/logs
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Deployment credential is not configured"; exit 1; }
          npx --no-install wrangler deployments list --name ideaboost-whiteboard --json
          npx --no-install wrangler deploy --name ideaboost-whiteboard --keep-vars --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID"
          npx --no-install wrangler deployments list --name ideaboost-whiteboard --json
      - name: Read-only production health and asset verification
        run: node scripts/deployment-check.mjs smoke
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
